name: FraudLens v3 pipeline

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-service.txt pytest httpx
      - name: Unit + integration tests (features, training, API)
        run: python -m pytest -q tests
      - name: Reproduce the shipped bundle's training run
        run: |
          python scripts/generate_dataset.py
          python -m fraudlens.train --out /tmp/bundle --report /tmp/EVALUATION.md
          cat /tmp/EVALUATION.md
